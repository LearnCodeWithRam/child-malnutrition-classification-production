events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 600s;
    types_hash_max_size 2048;

    # Allow high-resolution raw uncompressed child arm photos (up to 35 MB)
    client_max_body_size 35M;

    # Compression for static responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    upstream poshan_web {
        server web:8000;
        keepalive 32;
    }

    # =========================================================================
    # 1. HTTP Server (Port 80)
    # Serves ACME challenges for Certbot renewals & redirects all traffic to HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name pediamorph-ai.tech www.pediamorph-ai.tech _;

        # Let's Encrypt ACME challenge endpoint
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Automatic redirect from HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. HTTPS Server (Port 443) - SSL Activated for pediamorph-ai.tech
    # =========================================================================
    server {
        listen 443 ssl http2;
        server_name pediamorph-ai.tech www.pediamorph-ai.tech;

        # Let's Encrypt SSL Certificates
        ssl_certificate /etc/letsencrypt/live/pediamorph-ai.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pediamorph-ai.tech/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Bulk Data Export Streaming (Supports 8GB+ unbuffered downloads)
        location /api/v1/admin/export/ {
            proxy_pass http://poshan_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # Webhook & API endpoints (with 10-minute timeout)
        location / {
            proxy_pass http://poshan_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Static audit logs and generated visualizations
        location /audit_logs/ {
            alias /app/audit_logs/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
