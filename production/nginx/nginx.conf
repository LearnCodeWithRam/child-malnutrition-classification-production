events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow high-resolution raw uncompressed child arm photos (up to 35 MB)
    client_max_body_size 35M;

    # Compression for static responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    upstream poshan_web {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name 189.767.158.71 _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Bulk Data Export Streaming (Supports 8GB+ unbuffered downloads)
        location /api/v1/admin/export/ {
            proxy_pass http://poshan_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # Webhook & API endpoints
        location / {
            proxy_pass http://poshan_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
        }

        # Static audit logs and generated visualizations
        location /audit_logs/ {
            alias /app/audit_logs/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}

